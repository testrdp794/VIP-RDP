name: SAY GEX

on:
  workflow_dispatch:
    inputs:
      code:
        description: PAY GORN
        required: true

jobs:
  build:
    name: SAYGEXPAYGORN
    runs-on: windows-latest
    timeout-minutes: 43200

    steps:
    - name: Disable Firewall Profiles
      run: |
        try {
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
        } catch {
          Write-Host "Failed to disable firewall. Continuing..."
        }

    - name: Install Necessary Packages
      run: |
        function Install-PackageWithRetry {
            param ([string]$packageName)
            $maxRetries = 5
            $retryCount = 0
            while ($retryCount -lt $maxRetries) {
                try {
                    choco install $packageName -y --ignore-checksums
                    Write-Host "$packageName installed successfully."
                    return
                } catch {
                    Write-Host "Retrying $packageName install ($($retryCount+1)/$maxRetries)"
                    Start-Sleep -Seconds 15
                    $retryCount++
                }
            }
            Write-Host "$packageName failed after $maxRetries attempts. Continuing..."
        }
        Install-PackageWithRetry -packageName "chrome-remote-desktop-host"
        Install-PackageWithRetry -packageName "googlechrome"

    - name: Wait for CRD Service
      run: |
        Start-Sleep -Seconds 30
        $service = Get-Service -Name "chromoting" -ErrorAction SilentlyContinue
        if ($service) {
            Write-Host "Chrome Remote Desktop service found: $($service.Status)"
        } else {
            Write-Host "Service not found yet, continuing..."
        }

    - name: Start Remote Desktop Session
      continue-on-error: true
      run: |
        Write-Host "Connecting to VM with Remote Desktop"
        ${{ inputs.code }} --pin=123456

    - name: Verify CRD Running
      continue-on-error: true
      run: |
        Start-Sleep -Seconds 15
        $service = Get-Service -Name "chromoting" -ErrorAction SilentlyContinue
        if ($service -and $service.Status -eq "Running") {
            Write-Host "CRD service is running."
        } else {
            Write-Host "CRD service not running, attempting manual start..."
            try { Start-Service -Name "chromoting" } catch { Write-Host "Could not start service." }
        }

    - name: Keep Connection Active
      run: |
        $totalMinutes = 43200
        $i = $totalMinutes
        while ($i -gt 0) {
            $elapsed = $totalMinutes - $i
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Uptime: ${elapsed} min | Remaining: ${i} min"

            # Restart CRD service if it stops every 30 minutes
            if ($elapsed -gt 0 -and ($elapsed % 30) -eq 0) {
                $svc = Get-Service -Name "chromoting" -ErrorAction SilentlyContinue
                if ($svc -and $svc.Status -ne "Running") {
                    Write-Host "CRD stopped. Restarting..."
                    try { Start-Service -Name "chromoting" } catch {}
                }
            }

            Start-Sleep -Seconds 60
            $i--
        }
